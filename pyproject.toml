[project]
name = "backend"
version = "0.1.1"
description = "PalantINT Backend"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.4,<2.0.0",
    "asyncpg>=0.31.0,<0.32.0",
    "bcrypt>=3.2.2,<4.0.0",
    "fastapi>=0.134.0,<0.135.0",
    "httpx>=0.28.1,<0.29.0",
    "passlib[bcrypt]>=1.7.4,<2.0.0",
    "pydantic-settings>=2.13.1,<3.0.0",
    "python-dotenv>=1.2.1,<2.0.0",
    "python-jose[cryptography]>=3.5.0,<4.0.0",
    "python-multipart>=0.0.22,<0.0.23",
    "sqlalchemy[asyncio]>=2.0.47,<3.0.0",
    "sqlmodel>=0.0.37,<0.0.38",
    "mcp>=0.1.0",
    "fastmcp>=0.1.0",
    "starlette>=0.45.3",
    "uvicorn>=0.34.0",
]

[dependency-groups]
dev = [
    "bs4>=0.0.2,<0.0.3",
    "requests>=2.32.5,<3.0.0",
    "unidecode>=1.4.0,<2.0.0",
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
    "aiosqlite>=0.22.1",
    "ruff>=0.15.19",
]

[tool.ruff]
lint.ignore = ["E402", "E501"]
lint.extend-select = ["I"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/db", "src/core"]

